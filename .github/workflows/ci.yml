# CI de Patagonia Austral — corre en cada Pull Request hacia main y en push a main.
# Frontend: instala, lint (oxlint) y build (vite) — la regla del proyecto es que
# `npm run build` debe pasar antes de integrar. Backend: valida composer, lint de
# sintaxis PHP, y corre la suite de PHPUnit contra sqlite en memoria (sin secretos,
# sin base de datos externa) — esta es la "meta verificable" real de un /goal:
# antes solo se chequeaba sintaxis, ahora los tests de Feature/Unit tienen que pasar.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: sqlite3, pdo_sqlite
      - name: Validar composer.json
        run: composer validate --no-check-publish
      - name: Lint de sintaxis PHP
        run: find app database routes config -name '*.php' -print0 | xargs -0 -n1 -P4 php -l
      - name: Instalar dependencias
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Preparar entorno de testing
        run: |
          cp .env.example .env 2>/dev/null || true
          php artisan key:generate --env=testing || true
      - name: Correr PHPUnit
        run: php artisan test
