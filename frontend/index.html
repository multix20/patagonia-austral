<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <!-- iOS ignora los iconos del manifest: sin esto, "Agregar a pantalla de
         inicio" guarda una captura de la página en vez del icono. -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Patagonia" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- La barra de estado toma el color del contenido (verde de la cabecera). -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0F6E56" />
    <!-- Color de fondo en el HTML, no solo en styles.css: evita el destello
         blanco entre que arranca la app y carga la hoja de estilos. -->
    <style>
      html,
      body {
        background: #f7f5f0;
      }
    </style>
    <meta
      name="description"
      content="Guía turística de la Carretera Austral, de Puerto Montt a Villa O'Higgins. Atractivos, alojamiento, gastronomía, servicios y emergencias de cada localidad. Funciona sin conexión."
    />
    <title>Patagonia Austral — Guía de la Carretera Austral</title>
    <!-- Vista previa al compartir el enlace (Open Graph / Twitter Card).
         Esto NO es SEO: es lo que se ve cuando alguien manda rutaaustral.cl por
         WhatsApp, lo pega en un grupo de la Austral o lo pone en la bio de
         Instagram. Sin estas etiquetas la app se comparte como una línea de
         texto azul sin imagen ni explicación, que es el peor primer contacto
         posible para algo que hay que instalar. La imagen se genera con
         scripts/generar-og.py y va con URL ABSOLUTA: los rastreadores no
         resuelven rutas relativas. -->
    <link rel="canonical" href="https://rutaaustral.cl/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Patagonia Austral" />
    <meta property="og:locale" content="es_CL" />
    <meta property="og:url" content="https://rutaaustral.cl/" />
    <meta property="og:title" content="Patagonia Austral — la guía de la Carretera Austral" />
    <meta
      property="og:description"
      content="Las 28 localidades de Puerto Montt a Villa O'Higgins: qué visitar, dónde dormir, dónde comer, bencina, salud y emergencias. Gratis, se instala en el teléfono y sigue sirviendo en los tramos de ruta sin señal."
    />
    <meta property="og:image" content="https://rutaaustral.cl/og-rutaaustral.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Patagonia Austral — la guía de la Carretera Austral, 28 localidades de Puerto Montt a Villa O'Higgins"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- `beforeinstallprompt` se dispara UNA sola vez y no se repite: si en ese
         instante nadie lo está escuchando, el evento se pierde y el banner de
         instalar ya no puede aparecer en toda la visita. Chrome lo lanza apenas
         valida el manifest y el service worker, que en una visita repetida (con
         ambos ya en caché) ocurre ANTES de que descargue el bundle y React monte
         su listener. Por eso se atrapa acá, en un script normal del <head> que
         corre antes que todo lo demás, y la app lo recoge cuando monta. Sin
         esto el banner aparecía o no según quién ganara la carrera. -->
    <script>
      window.__instalarPrompt = null
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault()
        window.__instalarPrompt = e
        window.dispatchEvent(new Event('instalar-prompt-listo'))
      })
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
