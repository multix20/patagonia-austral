; Límites de subida — PWA Patagonia Austral
;
; La imagen oficial de PHP no trae php.ini, así que sin este archivo rigen los
; valores de fábrica: upload_max_filesize=2M y post_max_size=8M. Una foto de
; celular pesa 3–5 MB, o sea que NINGUNA pasaba, ni por el CMS (que anuncia un
; tope de 8 MB) ni por el formulario del dueño.
;
; El modo de fallar es especialmente malo: al pasarse de post_max_size, PHP
; descarta el cuerpo entero de la petición, no solo el archivo. Laravel recibe
; un formulario VACÍO, así que se pierde también todo lo que la persona escribió
; —teléfono, ubicación, descripción— sin un error que lo explique.

; Igual al tope que anuncian el CMS y el formulario (config/fotos.php →
; max_subida_kb). Que coincidan importa: si PHP corta más abajo, el mensaje de
; error que ve la persona miente sobre cuánto puede subir.
upload_max_filesize = 8M

; El envío completo: hasta 3 fotos por propuesta (config/fotos.php →
; max_por_propuesta) más los campos de texto, con holgura. Tiene que ser mayor
; que upload_max_filesize o PHP ignora el valor mayor de los dos.
post_max_size = 32M
