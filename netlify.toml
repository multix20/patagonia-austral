# Despliegue continuo Netlify — Patagonia Austral (frontend PWA)
# Variables del sitio: VITE_API_URL + VITE_VAPID_PUBLIC_KEY (ver DEPLOY.md)
[build]
  base    = "frontend"
  command = "npm run build"
  publish = "dist"

# Landing de presentación del proyecto (para municipios y servicios turísticos).
# Va ANTES del catch-all: en Netlify gana la primera regla que calza, y si el
# comodín quedara primero se tragaría también esta ruta.
[[redirects]]
  from = "/proyecto"
  to = "/proyecto.html"
  status = 200

# SPA: todas las rutas sirven index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
