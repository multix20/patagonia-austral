# Despliegue continuo Netlify — Patagonia Austral (frontend PWA)
# Variables del sitio: VITE_API_URL + VITE_VAPID_PUBLIC_KEY (ver DEPLOY.md)
[build]
  base    = "frontend"
  command = "npm run build"
  publish = "dist"

# Landing de presentación del proyecto (para municipios y servicios turísticos).
# Va ANTES del catch-all: en Netlify gana la primera regla que calza, y si el
# comodín quedara primero se tragaría también esta ruta.
[[redirects]]
  from = "/proyecto"
  to = "/proyecto.html"
  status = 200

# Formulario con el que el dueño de un servicio actualiza SU ficha. Lo sirve el
# BACKEND (Laravel), no la PWA: es una página que se abre una vez, con señal, y
# meterla en el bundle que se precachea para la ruta sería cargarle peso a quien
# nunca la va a abrir.
#
# Se proxea (status 200, no 301) para que el enlace del correo se vea del dominio
# propio. No es estética: un enlace a `…onrender.com` en un correo frío a un
# negocio que no te conoce parece phishing, y con razón.
#
# Va ANTES del comodín, por lo mismo que /proyecto.
[[redirects]]
  from = "/mi-ficha/*"
  to = "https://patagonia-austral-api.onrender.com/mi-ficha/:splat"
  status = 200
  force = true

# SPA: todas las rutas sirven index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
